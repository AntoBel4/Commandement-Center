const seed=()=>({items:[{id:1,name:'Tomates cerises',qty:'1 barquette',cat:'Fruits & légumes',by:'Belinda',source:'Alexa · cuisine',status:'open'},{id:2,name:'Avocats',qty:'2 pièces',cat:'Fruits & légumes',by:'Antoine',source:'Application',status:'open'},{id:3,name:'Pain de campagne',qty:'1 pain',cat:'Boulangerie',by:'Belinda',source:'Application',status:'open'},{id:4,name:'Yaourts nature',qty:'6 pots',cat:'Frais',by:'Antoine',source:'Telegram',status:'open'},{id:5,name:'Huile d’olive',qty:'1 bouteille',cat:'Épicerie',by:'Belinda',source:'Application',status:'tomorrow'},{id:6,name:'Café',qty:'1 paquet',cat:'Épicerie',by:'Antoine',source:'Application',status:'done'}],events:[{id:10,name:'Déjeuner ensemble',date:'2026-09-17',time:'12:30',duration:'60',who:'Tous les deux',place:'À la maison'},{id:11,name:'Rendez-vous garage',date:'2026-09-17',time:'18:30',duration:'30',who:'Antoine',place:'Garage du quartier'},{id:12,name:'Balade du dimanche',date:'2026-09-20',time:'10:00',duration:'90',who:'Tous les deux',place:'Au parc'},{id:13,name:'Soirée cinéma',date:'2026-09-19',time:'20:00',duration:'120',who:'Tous les deux',place:'Cinéma'}],morning:true,before:true,recap:true});
let data=seed(),view='home',filter='open',person='Antoine',selected='2026-09-17',weekOffset=0,counter=100,toastTimer,undoFn;
const active=()=>data.items.filter(i=>i.status==='open');
const dateFR=(s,opt={weekday:'long',day:'numeric',month:'long'})=>new Date(s+'T12:00:00').toLocaleDateString('fr-FR',opt);
const dayISO=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const sortedEvents=d=>data.events.filter(e=>e.date===d).sort((a,b)=>a.time.localeCompare(b.time));
function toast(msg,undo){clearTimeout(toastTimer);undoFn=undo;$('#toast').innerHTML=esc(msg)+(undo?'<button data-action="undo">Annuler</button>':'');$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),6500)}
function navigate(v){view=v;render();window.scrollTo(0,0)}
function header(title,sub,tag,button='Ajouter',act='add-item'){return `<div class="header row between"><div><div class="eyebrow">${tag}</div><h1>${title}</h1><p>${sub}</p></div><button class="btn primary" data-action="${act}" aria-label="${button}">${icon('plus')}${button}</button></div>`}
function render(){const navs=[['home','home','Aujourd’hui'],['shopping','bag','Courses'],['agenda','calendar','Agenda'],['settings','settings','Réglages']];$('#nav').innerHTML=navs.map(([v,ic,t])=>`<button data-view="${v}" class="${view===v?'active':''}" ${view===v?'aria-current="page"':''}>${icon(ic)}<span>${t}</span>${v==='shopping'?`<span class="count">${active().length}</span>`:''}</button>`).join('');$('#profile').textContent=person[0];$('#profile').setAttribute('aria-label',`Profil de démonstration : ${person}. Changer de profil`);$('#page').innerHTML=({home:home,shopping:shopping,agenda:agenda,settings:settings})[view]();}
function grocery(i,compact=false){return `<div class="grocery-item ${i.status==='done'?'item-done':''}"><button class="check ${i.status==='done'?'done':''}" data-action="buy" data-id="${i.id}" aria-label="${i.status==='done'?'Remettre à acheter':'Marquer acheté'} : ${esc(i.name)}"><span>${i.status==='done'?icon('check'):''}</span></button><div class="item-body"><div class="item-name">${esc(i.name)}${i.urgent?' <span class="pill orange">Urgent</span>':''}</div><div class="item-meta">${esc(i.qty)} · ${compact?esc(i.by):esc(i.source)+' · '+esc(i.by)}</div></div>${compact?`<span class="mini-avatar ${i.by==='Antoine'?'a':''}" title="Ajouté par ${esc(i.by)}">${esc(i.by[0])}</span>`:`<div class="item-actions">${i.status==='open'?`<button class="btn ghost" data-action="urgent" data-id="${i.id}" aria-label="${i.urgent?'Retirer l’urgence':'Signaler urgent'} : ${esc(i.name)}" title="Urgent (simulation)">${icon('bolt')}</button><button class="btn ghost" data-action="postpone" data-id="${i.id}" aria-label="Reporter à demain : ${esc(i.name)}" title="Demain">${icon('tomorrow')}</button>`:''}${i.status==='tomorrow'?`<button class="btn ghost" data-action="restore" data-id="${i.id}" aria-label="Remettre aujourd’hui : ${esc(i.name)}" title="Remettre aujourd’hui">${icon('tomorrow')}</button>`:''}<button class="btn ghost" data-action="delete-item" data-id="${i.id}" aria-label="Supprimer : ${esc(i.name)}" title="Supprimer">${icon('trash')}</button></div>`}</div>`}
function eventsHTML(events){return events.length?events.map((e,k)=>`<div class="agenda-item"><span class="time">${esc(e.time)}</span><span class="event-line ${k%2?'peach':''}"></span><div class="event-content"><button class="event-open" data-action="event" data-id="${e.id}"><h3>${esc(e.name)}</h3><small>${esc(e.who)} · ${esc(e.place||'Lieu à préciser')}</small></button></div></div>`).join(''):'<div class="empty"><h3>Du temps pour vous.</h3><small>Aucun rendez-vous prévu ce jour.</small></div>'}
function recapCard(){return `<div class="card card-pad recap"><div class="recap-icon">${icon('send')}</div><div class="eyebrow" style="color:#9c704b">Le petit rappel qui aide</div><h2>${data.recap?'On pense aux courses.':'Une pause pour les rappels.'}</h2><p>${data.recap?'À 17 h 20, votre liste vous retrouve sur Telegram. À tous les deux.':'Le récapitulatif est désactivé dans cet aperçu.'}</p><div class="recap-rule">${icon('clock')}<span>Demandes reçues avant 17 h 15.<br>Les suivantes passent au lendemain.</span></div><button class="btn" data-action="preview">Voir le récapitulatif ${icon('arrow')}</button></div>`}
function home(){return header(`Bonjour ${person}.`,'Voici ce qui vous attend, tous les deux.','Notre maison, aujourd’hui','Ajouter une course')+`<div class="dashboard"><div class="stack"><section class="card hero"><div class="hero-copy"><div class="eyebrow">La liste se prépare à deux</div><h2>${active().length?`${active().length} petites choses.<br>Une seule liste.`:'Tout est dans le panier.'}</h2><p>${active().length?'Les envies et les petits oublis de chacun, réunis au même endroit.':'La liste du jour est terminée. Profitez du reste de la journée.'}</p><button class="btn light" data-view="shopping">Ouvrir les courses ${icon('arrow')}</button></div><div class="hero-art" aria-hidden="true"><div class="halo"></div><div class="leek"></div><div class="leek two"></div><div class="bread"></div><div class="bag"></div><div class="spark">✧</div></div></section><section class="card card-pad shopping-card"><div class="section-title row between"><h2>À ne pas oublier</h2><span class="pill">${active().length} à acheter</span></div><div class="grocery-list">${active().slice(0,4).map(i=>grocery(i,true)).join('')||'<div class="empty">La liste du jour est vide.</div>'}</div><button class="btn text" data-view="shopping">Toute la liste ${icon('arrow')}</button></section></div><div class="stack"><section class="card card-pad agenda-card"><div class="section-title row between"><h2>Au programme</h2><span class="pill neutral">Aujourd’hui</span></div>${eventsHTML(sortedEvents('2026-09-17'))}<button class="btn text" data-view="agenda">Voir l’agenda ${icon('arrow')}</button></section>${recapCard()}</div></div>`}
function shopping(){let items=data.items.filter(i=>i.status===filter);let groups=[...new Set(items.map(i=>i.cat))];return header('Les courses.','Une envie, un oubli ? Ajoutez-le, c’est partagé.','À deux, c’est plus simple','Ajouter une course')+`<div class="full-grid"><section><div class="tabs" aria-label="Filtrer les courses">${[['open','À acheter'],['tomorrow','Demain'],['done','Achetés']].map(([f,l])=>`<button data-filter="${f}" class="${filter===f?'active':''}" aria-pressed="${filter===f}">${l} · ${data.items.filter(i=>i.status===f).length}</button>`).join('')}</div><div class="card card-pad">${items.length?groups.map(c=>`<div class="group-label">${esc(c)}</div>${items.filter(i=>i.cat===c).map(i=>grocery(i)).join('')}`).join(''):`<div class="empty">${icon('bag')}<h3>${filter==='done'?'Le panier attend ses premiers achats.':filter==='tomorrow'?'Rien de prévu pour demain.':'Tout est à jour.'}</h3><p>${filter==='open'?'Ajoutez une course pour commencer.':'Les articles apparaîtront ici au fil de vos actions.'}</p></div>`}</div><p class="form-note" style="margin:14px 4px">Cochez pour marquer acheté. La flèche ronde reporte à demain ; l’éclair simule une alerte urgente.</p></section><aside class="stack">${recapCard()}<div class="card card-pad"><div class="eyebrow muted">Chacun son rythme</div><div class="info-line"><span class="number">01</span><div><h3>On ajoute, quand on y pense.</h3><p>Dans l’application, puis avec Telegram et Alexa une fois connectés.</p></div></div><div class="info-line"><span class="number">02</span><div><h3>On garde ce qui reste.</h3><p>Une course non achetée reste ouverte. Rien ne disparaît tout seul.</p></div></div></div></aside></div>`}
function agenda(){let monday=new Date('2026-09-14T12:00:00');monday.setDate(monday.getDate()+7*weekOffset);let days=Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()+i);return dayISO(d)});return header('Notre agenda.','Les moments à partager. Les rendez-vous à garder en tête.','Du temps pour l’essentiel','Ajouter un rendez-vous','add-event')+`<div class="full-grid"><section class="card card-pad"><div class="row between"><h2 class="calendar-title">${dateFR(days[0],{month:'long',year:'numeric'})}</h2><div class="row" style="gap:2px"><button class="btn ghost icon-btn" data-action="prev-week" aria-label="Semaine précédente">${icon('prev')}</button><button class="btn ghost icon-btn" data-action="next-week" aria-label="Semaine suivante">${icon('next')}</button></div></div><div class="week">${days.map(d=>`<button class="day ${d===selected?'active':''}" data-day="${d}" aria-pressed="${d===selected}" aria-label="${dateFR(d)}"><small>${dateFR(d,{weekday:'short'})}</small><b>${Number(d.slice(-2))}</b><span class="event-dot ${sortedEvents(d).length?'':'none'}"></span></button>`).join('')}</div><div class="row between"><div class="eyebrow muted">${dateFR(selected)}</div>${selected!=='2026-09-17'?'<button class="btn text" data-action="today">Aujourd’hui</button>':''}</div>${eventsHTML(sortedEvents(selected))}<button class="btn text" data-action="add-event">${icon('plus')}Ajouter un moment</button></section><aside><div class="card card-pad"><div class="row" style="margin-bottom:19px">${icon('bell')}<h2>Au bon moment.</h2></div><p class="muted" style="font-size:13px">Un rappel partagé, pour que chacun ait l’esprit libre.</p><div class="reminder-card"><h3>Le matin, à 7 h</h3><p>${data.morning?'Votre programme du jour sur les deux téléphones.':'Rappel désactivé dans cet aperçu.'}</p></div><div class="reminder-card" style="background:#f3ede1"><h3>Une heure avant</h3><p>${data.before?'Un petit rappel avant chaque rendez-vous.':'Rappel désactivé dans cet aperçu.'}</p></div><button class="btn text" data-view="settings">Ajuster les rappels ${icon('arrow')}</button><p class="form-note">Exemples fictifs. Google Agenda n’est pas encore connecté.</p></div></aside></div>`}
function settingToggle(key,title,sub){return `<div class="setting-row"><div><h3>${title}</h3><small>${sub}</small></div><button class="switch" role="switch" aria-checked="${data[key]}" aria-label="${title}" data-toggle="${key}"></button></div>`}
function settings(){return header('À notre façon.','Les petits réglages qui rendent le quotidien plus simple.','Notre espace familial','Ajouter une course')+`<div class="banner">${icon('info')}<span>Vous explorez une maquette. Les modifications restent dans cette session ; aucun message ni rendez-vous réel n’est envoyé.</span></div><div class="settings-grid"><section class="card card-pad"><h2>Notre famille</h2><div class="setting-row"><div class="row"><span class="avatar">A</span><div><h3>Antoine</h3><small>Courses, agenda et récapitulatifs</small></div></div><span class="pill neutral">${person==='Antoine'?'Aperçu actuel':'Membre'}</span></div><div class="setting-row"><div class="row"><span class="avatar second" style="margin:0">B</span><div><h3>Belinda</h3><small>Courses, agenda et récapitulatifs</small></div></div><span class="pill neutral">${person==='Belinda'?'Aperçu actuel':'Membre'}</span></div><button class="btn text" data-action="profile">Essayer le profil ${person==='Antoine'?'Belinda':'Antoine'} ${icon('arrow')}</button></section><section class="card card-pad"><h2>Les rappels</h2>${settingToggle('recap','Courses · 17 h 20','Demandes avant 17 h 15, pour tous les deux.')}${settingToggle('morning','Le programme · 7 h','Les rendez-vous du jour, sur Telegram.')}${settingToggle('before','Rendez-vous · 1 h avant','Un rappel pour chacun de vous.')}<p class="form-note" style="margin-top:17px">Heures de Paris · réglages simulés</p></section><section class="card card-pad"><h2>Nos connexions</h2>${[['G','Google Agenda','Votre futur calendrier partagé'],['↗','Telegram Famille','Les courses et les rappels, à deux'],['a','Amazon Alexa','Echo Dot · salon et cuisine']].map(([mark,t,s])=>`<div class="setting-row"><span class="integration-logo" aria-hidden="true">${mark}</span><div class="integration-info"><h3>${t}</h3><small>${s}</small></div><span class="pill neutral">À connecter</span></div>`).join('')}</section><section class="card card-pad"><h2>Un espace qui grandit.</h2><p class="muted" style="font-size:13px;margin-top:15px">D’abord les courses et l’agenda. Ensuite, les menus de la semaine, les recettes et la maison connectée.</p><div class="row wrap" style="margin-top:20px"><span class="pill neutral">Menus & recettes · plus tard</span><span class="pill neutral">Home Assistant · plus tard</span></div><div class="setting-row" style="margin-top:12px"><div><h3>Les alertes techniques</h3><small>Léo restera réservé à Antoine pour les dysfonctionnements.</small></div>${icon('info')}</div><button class="btn text" data-action="reset">Réinitialiser la démonstration ${icon('tomorrow')}</button></section></div>`}
function openModal(title,body){$('#modal-body').innerHTML=`<div class="section-title row between"><h2 id="modal-title">${title}</h2><button class="btn ghost icon-btn" data-action="close" aria-label="Fermer">${icon('close')}</button></div>${body}`;if(!$('#modal').open)$('#modal').showModal();const inp=$('#modal input');if(inp)inp.focus()}
function addItem(){openModal('Une chose à ajouter ?',`<form id="item-form"><div class="field"><label for="item-name">De quoi a-t-on besoin ?</label><input id="item-name" name="name" placeholder="Des fraises, du lait…" maxlength="80" required autocomplete="off"></div><div class="two"><div class="field"><label for="item-qty">Quantité</label><input id="item-qty" name="qty" placeholder="1 paquet" maxlength="35"></div><div class="field"><label for="item-cat">Rayon</label><select id="item-cat" name="cat">${['Fruits & légumes','Frais','Boulangerie','Épicerie','Maison','Autre'].map(c=>`<option>${c}</option>`).join('')}</select></div></div><p class="form-note">Ajout par ${person}. Dans cette maquette, les ajouts vont dans la liste du jour. Aucun envoi réel.</p><div class="form-footer"><button type="button" class="btn" data-action="close">Annuler</button><button class="btn primary" type="submit">Ajouter à la liste</button></div></form>`)}
function addEvent(){openModal('Un moment à prévoir.',`<form id="event-form"><div class="field"><label for="event-name">Le rendez-vous</label><input id="event-name" name="name" placeholder="Dîner, rendez-vous, sortie…" maxlength="80" required></div><div class="two"><div class="field"><label for="event-date">Date</label><input id="event-date" name="date" type="date" min="2020-01-01" max="2100-12-31" value="${selected}" required></div><div class="field"><label for="event-time">Heure</label><input id="event-time" name="time" type="time" value="18:00" required></div></div><div class="two"><div class="field"><label for="event-who">Pour qui ?</label><select id="event-who" name="who"><option>Tous les deux</option><option>Antoine</option><option>Belinda</option></select></div><div class="field"><label for="event-duration">Durée</label><select id="event-duration" name="duration"><option value="30">30 minutes</option><option value="60" selected>1 heure</option><option value="90">1 h 30</option><option value="120">2 heures</option></select></div></div><div class="field"><label for="event-place">Lieu (facultatif)</label><input id="event-place" name="place" maxlength="80" placeholder="Où se retrouve-t-on ?"></div><p class="form-note">Aperçu uniquement. Ce rendez-vous ne sera pas ajouté à Google Agenda.</p><div class="form-footer"><button type="button" class="btn" data-action="close">Annuler</button><button class="btn primary" type="submit">Ajouter à l’agenda</button></div></form>`)}
function preview(){openModal('Votre récapitulatif.',`<p class="form-note" style="margin-bottom:16px">Simulation Telegram · aucun envoi à Antoine ou Belinda.${data.recap?'':' Le rappel est actuellement désactivé dans l’aperçu.'}</p><div class="telegram"><div class="bubble"><h3>Les courses de ce soir 🛍️</h3><p>${active().length?`Il reste ${active().length} article${active().length>1?'s':''} à acheter :`:'La liste du jour est terminée. Belle soirée !'}</p>${active().length?`<ul>${active().map(i=>`<li>${esc(i.name)} · ${esc(i.qty)}${i.urgent?' (urgent)':''}</li>`).join('')}</ul>`:''}<p>Antoine & Belinda, votre liste est prête.</p><span class="tg-time">17:20 · aperçu</span></div><button class="tg-action" data-action="open-shopping">Ouvrir la liste des courses →</button></div><p class="form-note" style="margin-top:14px">Les actions « Acheté », « Demain » et « Urgent » se testent dans l’onglet Courses.</p>`)}
function eventDetail(id){let e=data.events.find(x=>x.id===id);if(!e)return;openModal(esc(e.name),`<div class="modal-detail"><div class="row">${icon('calendar')}${dateFR(e.date)}</div><div class="row">${icon('clock')}${esc(e.time)} · ${esc(e.duration)} minutes</div><div class="row">${icon('people')}${esc(e.who)}</div><div class="row">${icon('pin')}${esc(e.place||'Lieu à préciser')}</div><div class="row">${icon('bell')}${data.before?'Rappel prévu 1 h avant (simulation)':'Rappel avant rendez-vous désactivé'}</div></div><p class="form-note">Rendez-vous fictif, sans synchronisation Google Agenda.</p><div class="form-footer"><button class="btn" data-action="delete-event" data-id="${e.id}">${icon('trash')}Supprimer</button><button class="btn primary" data-action="close">C’est noté</button></div>`)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){navigate(b.dataset.view);return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.day){selected=b.dataset.day;render();return}if(b.dataset.toggle){let k=b.dataset.toggle;data[k]=!data[k];b.setAttribute('aria-checked',String(data[k]));toast('Réglage modifié dans la maquette.');return}let id=Number(b.dataset.id),item=data.items.find(i=>i.id===id);switch(b.dataset.action){case'close':$('#modal').close();break;case'add-item':addItem();break;case'add-event':addEvent();break;case'preview':preview();break;case'open-shopping':$('#modal').close();navigate('shopping');break;case'event':eventDetail(id);break;case'profile':person=person==='Antoine'?'Belinda':'Antoine';render();toast(`Aperçu du profil ${person}.`);break;case'buy':case'postpone':case'restore':{if(!item)break;let old=item.status;item.status=b.dataset.action==='buy'?(old==='done'?'open':'done'):b.dataset.action==='postpone'?'tomorrow':'open';render();toast(item.status==='done'?'C’est dans le panier !':item.status==='tomorrow'?'Gardé pour demain.':'De retour dans la liste du jour.',()=>{item.status=old;render()});break}case'urgent':if(item){item.urgent=!item.urgent;render();toast(item.urgent?'Alerte urgente simulée pour vous deux. Aucun envoi réel.':'Urgence retirée.')}break;case'delete-item':if(item){let index=data.items.indexOf(item);data.items.splice(index,1);render();toast('Article supprimé de la maquette.',()=>{data.items.splice(index,0,item);render()})}break;case'delete-event':{let index=data.events.findIndex(x=>x.id===id);let ev=data.events.splice(index,1)[0];$('#modal').close();render();toast('Rendez-vous fictif supprimé.',()=>{data.events.splice(index,0,ev);render()});break}case'prev-week':case'next-week':weekOffset+=b.dataset.action==='next-week'?1:-1;{let d=new Date('2026-09-14T12:00:00');d.setDate(d.getDate()+weekOffset*7);selected=dayISO(d)}render();break;case'today':weekOffset=0;selected='2026-09-17';render();break;case'reset':data=seed();filter='open';weekOffset=0;selected='2026-09-17';render();toast('La démonstration est revenue à son point de départ.');break;case'undo':if(undoFn){undoFn();undoFn=null;$('#toast').classList.remove('show')}break}});
