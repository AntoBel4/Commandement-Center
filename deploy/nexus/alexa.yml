# Optional overlay, enabled only by .private/nexus/alexa.env.
services:
  alexa:
    image: commandement-alexa:${ALEXA_RELEASE:-${RELEASE:?}}
    build:
      context: ../..
      dockerfile: apps/alexa/Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      ALEXA_SKILL_ID: ${ALEXA_SKILL_ID:?}
      FAMILY_ID: ${FAMILY_ID:?}
      FAMILY_API_BASE_URL: http://api:3000
    networks: [internal, alexa_egress]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  web:
    volumes:
      - type: bind
        source: ./alexa-nginx.conf
        target: /etc/nginx/family-integrations/alexa.conf
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      alexa: {condition: service_healthy}
networks:
  # Outbound HTTPS is needed to verify Amazon's signing certificate.
  alexa_egress:
    driver: bridge
