# Publish only authenticated calendar operations; other /api routes stay closed.
location = /api/v1/calendar/events {
  proxy_pass $family_api;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
}
location ~ "^/api/v1/calendar/proposals(?:/[0-9a-fA-F-]{36}/actions)?$" {
  proxy_pass $family_api;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
}
