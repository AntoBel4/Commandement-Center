log_format family '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log /var/log/nginx/access.log family;
  client_max_body_size 128k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $family_api http://api:3000;
  set $family_identity http://keycloak:8080;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control "no-store" always;

  location /api/v1/grocery {
    proxy_pass $family_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  # Integration endpoints remain closed during the accounts/groceries pilot.
  location /api/ { return 404; }

  # Only the family realm and login assets are public. No admin/master/metrics.
  location ^~ /auth/realms/commandement/ {
    proxy_pass $family_identity;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
  }
  location ^~ /auth/resources/ {
    proxy_pass $family_identity;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
  }
  location /auth { return 404; }
  location = /config.json { try_files $uri =404; }
  location /src/ { try_files $uri =404; }
  location /vendor/ { try_files $uri =404; }
  location ~ /\. { return 404; }
  location / { try_files $uri $uri/ /index.html; }
  location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
}
