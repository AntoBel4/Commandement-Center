# Restore rehearsal only (restore-service.sh --rehearse). Standalone: never combined with
# compose.yml. No published port, no proxy network, no Traefik label, no production
# volume or bind mount; one internal network without egress, so no Google or Telegram call.
# web, telegram and alexa are deliberately absent.
# Memory ceilings apply only to this temporary project: 3.5 GiB combined.
# Equal memory/swap ceilings prevent these containers from consuming host swap.
name: ${REHEARSAL_PROJECT:?}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?}
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_DB: commandement
      POSTGRES_USER: commandement
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [rehearsal]

  keycloak-db:
    image: ${POSTGRES_IMAGE:?}
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes: ["keycloak_data:/var/lib/postgresql/data"]
    networks: [rehearsal]

  keycloak:
    image: ${KEYCLOAK_IMAGE:?}
    mem_limit: 2g
    memswap_limit: 2g
    command: [start]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HOSTNAME: https://${PORTAL_HOST:?}/auth
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    networks: [rehearsal]
    profiles: [services]
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /auth/health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  api:
    image: commandement-api:${RELEASE:?}
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      AUTH_ENABLED: "true"
      AUTH_ISSUER_URL: https://${PORTAL_HOST:?}/auth/realms/commandement
      AUTH_AUDIENCE: commandement-api
      AUTH_JWKS_URL: http://keycloak:8080/auth/realms/commandement/protocol/openid-connect/certs
      CORS_ORIGINS: https://${PORTAL_HOST:?}
      FAMILY_TIMEZONE: Europe/Paris
      # Deliberately no GOOGLE_* nor TELEGRAM_* variable and no secret file mounted.
    networks: [rehearsal]
    profiles: [services]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

volumes:
  postgres_data:
  keycloak_data:
networks:
  rehearsal:
    internal: true
