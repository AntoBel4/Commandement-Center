name: API and PostgreSQL tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: cc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: for script in deploy/nexus/*.sh; do bash -n "$script"; done
      - run: node --test deploy/nexus/test/prepare.test.mjs deploy/nexus/test/alexa-client.test.mjs
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/cc_test
