name: API and PostgreSQL tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: cc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: for script in deploy/nexus/*.sh; do bash -n "$script"; done
      - run: node --test deploy/nexus/test/prepare.test.mjs deploy/nexus/test/alexa-client.test.mjs deploy/nexus/test/backup-offsite.test.mjs deploy/nexus/test/restore-service.test.mjs deploy/nexus/test/monitor.test.mjs
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/cc_test

  image-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect images from a private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          context=$(mktemp -d)
          trap 'rm -rf -- "$context"' EXIT
          git archive HEAD | tar -x -C "$context"
          find "$context" -type d -exec chmod 700 {} +
          find "$context" -type f -exec chmod 600 {} +
          docker build -f "$context/apps/backend/Dockerfile" -t commandement-api:permissions-test "$context"
          docker build -f "$context/apps/web/Dockerfile" -t commandement-web:permissions-test "$context"
          docker run --rm --network none --read-only --entrypoint node commandement-api:permissions-test -e '
            const fs = require("node:fs");
            if (process.getuid() === 0) throw new Error("API must not run as root");
            function readTree(path) {
              for (const entry of fs.readdirSync(path, { withFileTypes: true })) {
                const child = path + "/" + entry.name;
                if (entry.isDirectory()) readTree(child);
                else fs.readFileSync(child);
              }
            }
            readTree("/app/apps/backend");
            readTree("/app/supabase/migrations");
            fs.readFileSync("/app/package.json");
            console.log("API sources and migrations readable as UID " + process.getuid());
          '
          docker run --rm --network none --read-only --user nginx --entrypoint sh commandement-web:permissions-test -ec '
            test "$(id -u)" -ne 0
            tar -cf /dev/null -C /usr/share/nginx/html .
            test -r /etc/nginx/conf.d/default.conf
            echo "Web assets and configuration readable as nginx"
          '
